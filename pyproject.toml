[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vouqis-verify"
dynamic = ["version"]
description = "Catch silent failures and regressions in RAG and AI agent workflows before you ship."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Sasi Sundar" }]
keywords = ["rag", "llm", "agents", "evaluation", "regression-testing", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8", "types-PyYAML", "build>=1.0", "twine>=5"]

[project.scripts]
vouqis = "vouqis_verify.cli:main"

[project.urls]
Homepage = "https://github.com/Sasisundar2211/VouqisVerify"
Issues = "https://github.com/Sasisundar2211/VouqisVerify/issues"
Changelog = "https://github.com/Sasisundar2211/VouqisVerify/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/vouqis_verify/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vouqis_verify"]

[tool.hatch.build.targets.sdist]
include = ["src/vouqis_verify", "tests", "examples", "docs", "README.md", "CHANGELOG.md", "LICENSE", "action.yml"]
exclude = ["**/.claude-flow", "**/.swarm", "**/__pycache__", "**/.pytest_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.List/Optional for 3.9 readability

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S314", "S603", "S607"]  # tests parse XML the tool itself wrote
"examples/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
files = ["src/vouqis_verify"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
