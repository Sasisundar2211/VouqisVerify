[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vouqis-verify"
version = "0.1.2"
description = "Verify every AI change before it reaches production"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vouqis", email = "sasisundhar2211@gmail.com" }]
keywords = ["ai", "evaluation", "github-actions", "llm", "testing", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://vouqis.tech"
Repository = "https://github.com/Sasisundar2211/VouqisVerify"
"Bug Tracker" = "https://github.com/Sasisundar2211/VouqisVerify/issues"

[project.scripts]
vouqis = "vouqis_verify.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
